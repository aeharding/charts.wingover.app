# Full CONUS bake, sharded across hosted runners:
#
#   plan ─→ regions (37-way) ─→ cutlines ─→ warp (37-way) ─→ tile (bands) ─→ verify
#                                                        └──→ overview ──────┘
#
# fetch:    zips into an actions/cache keyed by cycle — FAA is contacted
#           once per cycle EVER; all other jobs restore the cache
# regions:  extract sheet, derive its data region      (per-sheet artifact)
# cutlines: merge regions, cross-sheet hole gate, emit cutline2 polygons
# warp:     fetch sheet again (51 MB, seconds), cutline-cropped warp at
#           the @3x z12 grid, stage tif to R2 scratch/<run_id>/
# tile:     z8-12 per z8-aligned longitude band, VRT over /vsis3/ scratch,
#           sync straight to the immutable release prefix
# overview: z0-7 from a downsampled whole-CONUS warp of the same VRT
# verify:   R2 object count + the sentinel tiles that v2 shipped missing
#           (Corpus Christi, Montreal, Houlton, Yellowstone), then drop
#           the scratch prefix.
#
# The release prefix is NEVER an existing one: tiles are cached immutable
# at the edge and in clients; every bake ships to a fresh prefix and the
# app flips when verified.
name: bake
on:
  workflow_call:
    inputs:
      cycle:
        type: string
        default: 07-09-2026
      prefix:
        type: string
        default: 07-09-2026g
      stages:
        type: string
        default: all
      region:
        type: string
        default: conus
  workflow_dispatch:
    inputs:
      cycle:
        description: FAA cycle (MM-DD-YYYY)
        default: 07-09-2026
      prefix:
        description: Release prefix under /vfr/ (MUST be new)
        default: 07-09-2026c-ci
      stages:
        description: all, or overview (z0-7 only, self-contained)
        default: all
      region:
        description: region to bake (see regions.json)
        default: conus

env:
  BUCKET: wingover-charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sheets: ${{ steps.emit.outputs.sheets }}
      bands: ${{ steps.emit.outputs.bands }}
    steps:
      - uses: actions/checkout@v7
      - id: emit
        run: |
          echo "sheets=$(grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "bands=$(python3 scripts/bands.py "${{ inputs.region }}")" >> "$GITHUB_OUTPUT"

  # Download every sheet's zip ONCE per cycle into an actions/cache keyed
  # by the cycle (FAA zips are immutable within a cycle). Every other job
  # restores this cache; FAA is never polled twice for the same data.
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: zips
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}
      - if: steps.zips.outputs.cache-hit != 'true'
        run: |
          for c in $(grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt); do
            bash scripts/ci-fetch.sh "$(echo "$c" | sed 's/::.*//')" "${{ inputs.cycle }}"
          done

  regions:
    if: ${{ inputs.stages == 'all' }}
    needs: [plan, fetch]
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        sheet: ${{ fromJSON(needs.plan.outputs.sheets) }}
    steps:
      - uses: actions/checkout@v7
      # actions/cache keys the cache VERSION by compression tool: the
      # plain-runner fetch job saves with zstd, so the container must
      # have zstd too or every restore silently misses and refetches
      # from FAA (observed: 76 misses in run 30145552524).
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}
      - name: Extract and derive
        env:
          REGION: ${{ inputs.region }}
        run: |
          ln -s "$PWD" /repo
          bash scripts/ci-fetch.sh "$(echo "${{ matrix.sheet }}" | sed 's/::.*//')" "${{ inputs.cycle }}"
          echo "${{ matrix.sheet }}" > charts-${{ inputs.region }}.txt
          python3 scripts/derive.py
      - name: Safe artifact name
        id: an
        run: echo "name=$(echo '${{ matrix.sheet }}' | tr ' :' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          # region-scoped: bake-all runs every region in ONE workflow run,
          # so bare sheet names collide (both Aleutian halves share a scan)
          # and a region would merge its neighbours' geometry.
          name: regions-${{ inputs.region }}-${{ steps.an.outputs.name }}
          path: data/${{ inputs.region }}/dataregions.json

  cutlines:
    needs: regions
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: regions-${{ inputs.region }}-*
          path: regions/
      - name: Merge and finalize
        env:
          REGION: ${{ inputs.region }}
        run: |
          ln -s "$PWD" /repo
          mkdir -p data/conus
          mkdir -p "data/${{ inputs.region }}"
          python3 scripts/merge.py regions/
          grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | sed 's/::.*//' | xargs -I{} mkdir -p data/src/{}
          python3 scripts/finalize.py
      - uses: actions/upload-artifact@v7
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/*/*.geojson

  # BLOCKING GATES. These ran only on a laptop until now, which is how a
  # detector that deleted five states reached shipped tiles with every
  # CI check green. They run before the expensive warp/tile stages so a
  # broken run costs minutes, not hours.
  gate:
    needs: cutlines
    if: ${{ inputs.stages == 'all' }}
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}
      - uses: actions/download-artifact@v8
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/
      - name: Sheet list matches FAA
        run: |
          ln -s "$PWD" /repo
          python3 scripts/check-sheet-list.py "${{ inputs.cycle }}"
      - name: Area drift vs baseline
        env:
          REGION: ${{ inputs.region }}
        run: python3 scripts/area-check.py "${{ inputs.region }}"
      - name: Render preview and check coverage + seams
        env:
          REGION: ${{ inputs.region }}
        run: |
          grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | sed 's/::.*//' | sort -u \
            | while IFS= read -r c; do
                [ -n "$c" ] || continue
                bash scripts/ci-fetch.sh "$c" "${{ inputs.cycle }}"
              done
          bash scripts/preview.sh
          python3 scripts/coverage-check.py "${{ inputs.region }}"
          python3 scripts/seamscan.py | tail -20

  warp:
    needs: [plan, cutlines, gate]
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        sheet: ${{ fromJSON(needs.plan.outputs.sheets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/
      # actions/cache keys the cache VERSION by compression tool: the
      # plain-runner fetch job saves with zstd, so the container must
      # have zstd too or every restore silently misses and refetches
      # from FAA (observed: 76 misses in run 30145552524).
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}
      - name: Extract, warp, stage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ln -s "$PWD" /repo
          bash scripts/ci-fetch.sh "$(echo "${{ matrix.sheet }}" | sed 's/::.*//')" "${{ inputs.cycle }}"
          mkdir -p "data/${{ inputs.region }}" && cd "data/${{ inputs.region }}"
          eval "$(python3 /repo/scripts/unit-env.py "${{ inputs.region }}" "${{ matrix.sheet }}")"
          [ -f "$VRT" ] || gdal_translate -q -of vrt -expand rgb "$TIF" "$VRT"
          gdalwarp -q -t_srs EPSG:3857 \
            -tr 12.7395047141960 12.7395047141960 \
            -r cubic -dstalpha -cutline "$CUT" -crop_to_cutline \
            -co COMPRESS=DEFLATE -co TILED=YES -co BIGTIFF=IF_SAFER \
            -multi -wo NUM_THREADS=3 "$VRT" "$UNIT.tif"
          command -v aws >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq awscli >/dev/null; }
          aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 cp --quiet \
            "$UNIT.tif" "s3://$BUCKET/scratch/${{ github.run_id }}/warped/$UNIT.tif"

  tile:
    needs: [plan, warp]
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        band: ${{ fromJSON(needs.plan.outputs.bands) }}
    steps:
      - uses: actions/checkout@v7
      - name: Tile band z8-12 and ship
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_VIRTUAL_HOSTING: "FALSE"
          GDAL_NUM_THREADS: ALL_CPUS
          # Retries for the brief /vsis3/ header reads below; the bulk
          # pixel data is localized first, precisely because one flaky
          # ranged read 80 minutes into a streamed encode killed a band.
          GDAL_HTTP_MAX_RETRY: "8"
          GDAL_HTTP_RETRY_DELAY: "2"
          BX0: ${{ matrix.band.x0 }}
          BX1: ${{ matrix.band.x1 }}
          RUN_ID: ${{ github.run_id }}
        run: |
          export AWS_S3_ENDPOINT="$(echo "${{ secrets.R2_ENDPOINT }}" | sed 's|https://||')"
          command -v aws >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq awscli >/dev/null; }
          # Which sheets intersect this band? Header reads only.
          python3 - > fetch.txt <<'EOF'
          import os
          from osgeo import gdal
          gdal.UseExceptions()
          x0, x1 = float(os.environ["BX0"]), float(os.environ["BX1"])
          charts = [
              line.strip()
              for line in open("charts-${{ inputs.region }}.txt")
              if line.strip() and not line.startswith("#")
          ]
          for c in charts:
              uri = f"/vsis3/{os.environ['BUCKET']}/scratch/{os.environ['RUN_ID']}/warped/{c}.tif"
              cc = gdal.Info(uri, format="json")["cornerCoordinates"]
              if cc["lowerRight"][0] > x0 and cc["upperLeft"][0] < x1:
                  print(c)
          EOF
          echo "band sheets: $(tr '\n' ' ' < fetch.txt)"
          # Localize the inputs: aws cp retries properly, and the encode
          # then runs against local disk instead of a 90-minute HTTP stream.
          mkdir -p warped
          for c in $(cat fetch.txt); do
            aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 cp --quiet \
              "s3://$BUCKET/scratch/$RUN_ID/warped/$c.tif" "warped/$c.tif"
          done
          gdalbuildvrt -te ${{ matrix.band.x0 }} 2600000 ${{ matrix.band.x1 }} 6500000 \
            band.vrt warped/*.tif
          gdal raster tile -f JPEGXL \
            --creation-option LOSSLESS=NO --creation-option DISTANCE=4 --creation-option EFFORT=7 \
            --tile-size 768 --min-zoom 8 --max-zoom 12 --convention xyz \
            --resampling cubic --overview-resampling average \
            --skip-blank --webviewer none band.vrt tiles3x
          echo "band ${{ matrix.band.name }}: $(find tiles3x -name '*.jxl' | wc -l) tiles"
          command -v aws >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq awscli >/dev/null; }
          aws configure set default.s3.max_concurrent_requests 4
          aws configure set default.s3.max_bandwidth 50MB/s
          aws configure set retry_mode adaptive
          aws configure set max_attempts 10
          # R2 throttles same-prefix PUT bursts; adaptive retries plus a
          # whole-sync retry loop turn that into slowness, not failure
          # (a band died at 96% on ServiceUnavailable otherwise).
          for attempt in 1 2 3 4 5; do
            if aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 sync --only-show-errors \
                 --content-type image/jxl --cache-control "public, max-age=31536000, immutable" \
                 tiles3x/ "s3://$BUCKET/vfr/${{ inputs.prefix }}/3x/"; then
              break
            fi
            echo "sync attempt $attempt failed; retrying"
            sleep $((attempt * 30))
          done

  # Self-contained on purpose: z0-7 needs only ~10x-decimated imagery, so
  # warping the ORIGINAL scans at the z7 grid (with the same detected
  # cutlines, re-derived here in seconds per sheet) beats streaming 100GB
  # of full-res scratch warps through /vsis3/ — the v1 of this job did
  # exactly that and blew a 1-hour timeout. No needs: runs in parallel
  # with everything and is dispatchable alone (stages=overview).
  overview:
    needs: fetch
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      # actions/cache keys the cache VERSION by compression tool: the
      # plain-runner fetch job saves with zstd, so the container must
      # have zstd too or every restore silently misses and refetches
      # from FAA (observed: 76 misses in run 30145552524).
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}
      - name: Extract, derive, low-res warp, tile z0-7
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GDAL_NUM_THREADS: ALL_CPUS
          # derive/finalize run here too: without REGION they silently
          # read the CONUS chart list and fail on 37 missing sheets
          REGION: ${{ inputs.region }}
        run: |
          ln -s "$PWD" /repo
          CHARTS=$(grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt)
          # entries contain spaces ("Dir::Tif Stem") and a unit's zip is
          # named for its DIRECTORY, so strip the ::stem before fetching
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            bash scripts/ci-fetch.sh "$(printf '%s' "$c" | sed 's/::.*//')" "${{ inputs.cycle }}"
          done <<< "$CHARTS"
          python3 scripts/derive.py
          python3 scripts/finalize.py
          mkdir -p "data/${{ inputs.region }}" && cd "data/${{ inputs.region }}"
          mkdir -p lowres
          # z7@3x ground resolution — the whole CONUS mosaic is ~13k px wide
          while IFS= read -r c; do
            [ -n "$c" ] || continue
            eval "$(python3 /repo/scripts/unit-env.py "${{ inputs.region }}" "$c")"
            [ -f "$VRT" ] || gdal_translate -q -of vrt -expand rgb "$TIF" "$VRT"
            gdalwarp -q -t_srs EPSG:3857 -tr 407.664150854 407.664150854 \
              -r average -dstalpha -cutline "$CUT" -crop_to_cutline \
              "$VRT" "lowres/$UNIT.tif"
          done <<< "$CHARTS"
          gdalbuildvrt conus-low.vrt lowres/*.tif
          gdal raster tile -f JPEGXL \
            --creation-option LOSSLESS=NO --creation-option DISTANCE=4 --creation-option EFFORT=7 \
            --tile-size 768 --min-zoom 0 --max-zoom 7 --convention xyz \
            --resampling cubic --overview-resampling average \
            --skip-blank --webviewer none conus-low.vrt tiles3x
          echo "overview: $(find tiles3x -name '*.jxl' | wc -l) tiles"
          command -v aws >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq awscli >/dev/null; }
          aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 sync --only-show-errors \
            --content-type image/jxl --cache-control "public, max-age=31536000, immutable" \
            tiles3x/ "s3://$BUCKET/vfr/${{ inputs.prefix }}/3x/"

  # Runs even when the bake fails: verify only runs on success, so a
  # failed run used to leak ~100 GB of staged warps until the bucket
  # lifecycle rule swept them.
  cleanup:
    needs: [tile, overview]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Drop scratch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 rm --recursive --only-show-errors \
            "s3://$BUCKET/scratch/${{ github.run_id }}/" || true

  verify:
    needs: [tile, overview]
    runs-on: ubuntu-latest
    steps:
      - name: Count and sentinel tiles
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          # NOTE: every region ships into the same prefix, so this is a
          # whole-product count, not this region's alone. Good enough as
          # a floor; per-region truth comes from the coverage gate.
          total=$(aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 ls --recursive \
            "s3://$BUCKET/vfr/${{ inputs.prefix }}/3x/" | wc -l)
          echo "shipped tiles: $total"
          # Per-region floor: CONUS ships ~240k tiles, Samoa a few
          # hundred. A single global threshold would either wave through
          # a broken CONUS or fail every small region.
          case "${{ inputs.region }}" in
            conus) floor=200000 ;;
            alaska) floor=40000 ;;
            caribbean) floor=3000 ;;
            hawaii) floor=1000 ;;
            aleutians_west|mariana|samoa) floor=100 ;;
            *) floor=100 ;;
          esac
          [ "$total" -ge "$floor" ] || { echo "only $total tiles for ${{ inputs.region }} (floor $floor)" >&2; exit 1; }
          # The v2 regressions, plus the v1 Yellowstone hole: all must
          # exist. These are CONUS tiles; other regions rely on the
          # per-region floor above and the coverage sentinels run
          # before dispatch.
          [ "${{ inputs.region }}" = conus ] || exit 0
          for t in 10/234/429 10/302/366 10/319/363 11/420/742; do
            aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3api head-object \
              --bucket "$BUCKET" --key "vfr/${{ inputs.prefix }}/3x/$t.jxl" >/dev/null \
              && echo "sentinel OK: $t" || { echo "MISSING sentinel: $t" >&2; exit 1; }
          done

