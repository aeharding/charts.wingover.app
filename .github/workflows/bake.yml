# Per-region PREPARE: everything up to and including the warp.
#
#   plan ─→ regions (per sheet) ─→ cutlines ─→ gate ─→ warp (per sheet)
#
# fetch:    zips into an actions/cache keyed by cycle AND region — one
#           immutable key shared by 8 regions meant 7 of them missed
#           forever and refetched from FAA every run
# regions:  extract sheet, derive its data region      (per-sheet artifact)
# cutlines: merge regions, cross-sheet hole gate, emit cutline2 polygons
# gate:     sheet list, coverage sentinels, area drift, seams, unit names
# warp:     cutline-cropped warp at the @3x z12 grid, body AND overedge,
#           staged to R2 scratch/<run_id>/<region>/
#
# Tiling is NOT here: it is global (tile.yml), across every region at
# once. Tile keys carry no region, so per-region tiling had two jobs
# writing the same keys wherever regions overlap, and a tile the boundary
# crossed came out half blank whichever job synced last.
#
# The release prefix is NEVER an existing one: tiles are cached immutable
# at the edge and in clients; every bake ships to a fresh prefix and the
# app flips when verified.
name: bake
on:
  workflow_call:
    inputs:
      cycle:
        type: string
        default: 07-09-2026
      prefix:
        type: string
        default: 07-09-2026g
      stages:
        type: string
        default: all
      region:
        type: string
        default: conus
      dry_run:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      cycle:
        description: FAA cycle (MM-DD-YYYY)
        default: 07-09-2026
      prefix:
        description: Release prefix under /vfr/ (MUST be new)
        default: 07-09-2026c-ci
      stages:
        description: all, or overview (z0-7 only, self-contained)
        default: all
      region:
        description: region to bake (see regions.json)
        default: conus
      dry_run:
        description: run every stage but publish nothing
        type: boolean
        default: false

env:
  BUCKET: wingover-charts

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sheets: ${{ steps.emit.outputs.sheets }}
      bands: ${{ steps.emit.outputs.bands }}
    steps:
      - uses: actions/checkout@v7
      - id: emit
        run: |
          sheets=$(grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | jq -R . | jq -sc .)
          bands=$(python3 scripts/bands.py "${{ inputs.region }}")
          # FAIL LOUDLY on an empty matrix. bands.py used to die here
          # (it hardcoded /repo, absent on a plain runner); the error
          # vanished into command substitution, the tile matrix came out
          # empty, every tile job skipped, and the bake shipped only
          # z0-7 while reporting success.
          [ "$(printf '%s' "$sheets" | jq 'length')" -gt 0 ] || { echo "empty sheet list" >&2; exit 1; }
          [ "$(printf '%s' "$bands" | jq 'length')" -gt 0 ] || { echo "empty band list" >&2; exit 1; }
          echo "sheets=$sheets" >> "$GITHUB_OUTPUT"
          echo "bands=$bands" >> "$GITHUB_OUTPUT"
          echo "planned $(printf '%s' "$sheets" | jq 'length') sheets, $(printf '%s' "$bands" | jq 'length') bands"

  # Download every sheet's zip ONCE per cycle into an actions/cache keyed
  # by the cycle (FAA zips are immutable within a cycle). Every other job
  # restores this cache; FAA is never polled twice for the same data.
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        id: zips
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}-${{ inputs.region }}
      - if: steps.zips.outputs.cache-hit != 'true'
        run: |
          # LINE BY LINE, like every other consumer of a chart list:
          # entries are "Dir::Tif Stem", so word splitting turns one sheet
          # into five bogus ones. This was masked until the cache key was
          # region-scoped, because these regions used to get another
          # region's cache hit and skip the step entirely.
          # sort -u because several units share one zip (the Hawaiian
          # Islands sheet carries four).
          grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | sed 's/::.*//' | sort -u \
            | while IFS= read -r c; do
                [ -n "$c" ] || continue
                bash scripts/ci-fetch.sh "$c" "${{ inputs.cycle }}"
              done

  regions:
    if: ${{ inputs.stages == 'all' }}
    needs: [plan, fetch]
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        sheet: ${{ fromJSON(needs.plan.outputs.sheets) }}
    steps:
      - uses: actions/checkout@v7
      # actions/cache keys the cache VERSION by compression tool: the
      # plain-runner fetch job saves with zstd, so the container must
      # have zstd too or every restore silently misses and refetches
      # from FAA (observed: 76 misses in run 30145552524).
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}-${{ inputs.region }}
      - name: Extract and derive
        env:
          REGION: ${{ inputs.region }}
        run: |
          ln -s "$PWD" /repo
          bash scripts/ci-fetch.sh "$(echo "${{ matrix.sheet }}" | sed 's/::.*//')" "${{ inputs.cycle }}"
          echo "${{ matrix.sheet }}" > charts-${{ inputs.region }}.txt
          python3 scripts/derive.py
      - name: Safe artifact name
        id: an
        run: echo "name=$(echo '${{ matrix.sheet }}' | tr ' :' '__')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          # region-scoped: bake-all runs every region in ONE workflow run,
          # so bare sheet names collide (both Aleutian halves share a scan)
          # and a region would merge its neighbours' geometry.
          name: regions-${{ inputs.region }}-${{ steps.an.outputs.name }}
          path: data/${{ inputs.region }}/dataregions.json

  cutlines:
    needs: regions
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: regions-${{ inputs.region }}-*
          path: regions/
      - name: Merge and finalize
        env:
          REGION: ${{ inputs.region }}
        run: |
          ln -s "$PWD" /repo
          mkdir -p data/conus
          mkdir -p "data/${{ inputs.region }}"
          python3 scripts/merge.py regions/
          grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | sed 's/::.*//' | xargs -I{} mkdir -p data/src/{}
          python3 scripts/finalize.py
      - uses: actions/upload-artifact@v7
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/*/*.geojson

  # BLOCKING GATES. These ran only on a laptop until now, which is how a
  # detector that deleted five states reached shipped tiles with every
  # CI check green. They run before the expensive warp/tile stages so a
  # broken run costs minutes, not hours.
  gate:
    needs: cutlines
    if: ${{ inputs.stages == 'all' }}
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    steps:
      - uses: actions/checkout@v7
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}-${{ inputs.region }}
      - uses: actions/download-artifact@v8
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/
      - name: Unit names are S3-safe and consistent
        run: python3 scripts/check-unit-names.py
      - name: Sheet list matches FAA
        run: |
          ln -s "$PWD" /repo
          python3 scripts/check-sheet-list.py "${{ inputs.cycle }}"
      - name: Area drift vs baseline
        env:
          REGION: ${{ inputs.region }}
        run: python3 scripts/area-check.py "${{ inputs.region }}"
      - name: Render preview and check coverage + seams
        env:
          REGION: ${{ inputs.region }}
        run: |
          grep -vE '^\s*(#|$)' charts-${{ inputs.region }}.txt | sed 's/::.*//' | sort -u \
            | while IFS= read -r c; do
                [ -n "$c" ] || continue
                bash scripts/ci-fetch.sh "$c" "${{ inputs.cycle }}"
              done
          bash scripts/preview.sh
          python3 scripts/coverage-check.py "${{ inputs.region }}"
          python3 scripts/seamscan.py | tail -20
          # After the fetch: this reads the scans, not just the geometry.
          # CONTAINED and SCALE block; FURNITURE is advisory, since a
          # whiteness test cannot see a coloured tint ramp. The Honolulu
          # inset was a 1:250k blow-up lying 100% inside the main Hawaii
          # sheet, and every other gate passed it.
          python3 scripts/audit-units.py "${{ inputs.region }}"

  warp:
    needs: [plan, cutlines, gate]
    runs-on: ubuntu-latest
    container: ghcr.io/osgeo/gdal:ubuntu-full-latest
    defaults: { run: { shell: bash } }
    strategy:
      fail-fast: false
      matrix:
        sheet: ${{ fromJSON(needs.plan.outputs.sheets) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cutlines-${{ inputs.region }}
          path: data/src/
      # actions/cache keys the cache VERSION by compression tool: the
      # plain-runner fetch job saves with zstd, so the container must
      # have zstd too or every restore silently misses and refetches
      # from FAA (observed: 76 misses in run 30145552524).
      - run: command -v zstd >/dev/null || { apt-get update -qq && apt-get install -y -qq zstd; } >/dev/null
      - uses: actions/cache/restore@v6
        with:
          path: data/zips
          key: faa-src-${{ inputs.cycle }}-${{ inputs.region }}
      - name: Extract, warp, stage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          ln -s "$PWD" /repo
          bash scripts/ci-fetch.sh "$(echo "${{ matrix.sheet }}" | sed 's/::.*//')" "${{ inputs.cycle }}"
          mkdir -p "data/${{ inputs.region }}" && cd "data/${{ inputs.region }}"
          eval "$(python3 /repo/scripts/unit-env.py "${{ inputs.region }}" "${{ matrix.sheet }}")"
          [ -f "$VRT" ] || gdal_translate -q -of vrt -expand rgb "$TIF" "$VRT"
          gdalwarp -q -t_srs EPSG:3857 \
            -tr 12.7395047141960 12.7395047141960 \
            -r cubic -dstalpha -cutline "$CUT" -crop_to_cutline \
            -co COMPRESS=DEFLATE -co TILED=YES -co BIGTIFF=IF_SAFER \
            -multi -wo NUM_THREADS=3 "$VRT" "$UNIT.tif"
          # OVEREDGE strip as well. Only preview.sh used to draw these,
          # so the QA mosaic and the shipped tiles were built from
          # different inputs: every seam I signed off on was verified
          # against a picture the bake could not produce.
          side="${CUT%.cutline.geojson}.side.geojson"
          if [ -f "$side" ]; then
            gdalwarp -q -t_srs EPSG:3857 \
              -tr 12.7395047141960 12.7395047141960 \
              -r cubic -dstalpha -cutline "$side" -crop_to_cutline \
              -co COMPRESS=DEFLATE -co TILED=YES -co BIGTIFF=IF_SAFER \
              -multi -wo NUM_THREADS=3 "$VRT" "$UNIT.side.tif"
          fi
          # LOW-RES copies for the global z0-7 overview. The overview
          # cannot downsample the full-res warps: they carry no overviews,
          # so reading the whole product at z7 would stream ~170 GB. These
          # are the z7@3x grid, a few MB each, and staging them here keeps
          # the overview job to one cheap download.
          for src in "$UNIT.tif" "$UNIT.side.tif"; do
            [ -f "$src" ] || continue
            gdalwarp -q -tr 407.664150854 407.664150854 -r average \
              -co COMPRESS=DEFLATE -co TILED=YES "$src" "low_$src"
          done
          command -v aws >/dev/null || { apt-get update -qq >/dev/null && apt-get install -y -qq awscli >/dev/null; }
          # --only-show-errors, NOT --quiet: --quiet hides the error too,
          # so three warps failed with a silent exit 1 and no clue why.
          # Retries because R2 throttles bursts and these uploads had
          # none, while the tile sync has had a retry loop ever since a
          # band died at 96% on ServiceUnavailable. Staging the low-res
          # copies doubled the object count to ~236 per bake.
          aws configure set retry_mode adaptive
          aws configure set max_attempts 10
          put() {
            for attempt in 1 2 3 4 5; do
              if aws --endpoint-url "${{ secrets.R2_ENDPOINT }}" s3 cp --only-show-errors "$1" "$2"; then
                return 0
              fi
              echo "upload attempt $attempt failed for $1; retrying" >&2
              sleep $((attempt * 15))
            done
            echo "upload FAILED after 5 attempts: $1 -> $2" >&2
            return 1
          }
          base="s3://$BUCKET/scratch/${{ github.run_id }}/${{ inputs.region }}"
          for f in "$UNIT.tif" "$UNIT.side.tif"; do
            [ -f "$f" ] || continue
            echo "staging $f ($(du -h "$f" | cut -f1) full, $(du -h "low_$f" | cut -f1) low)"
            put "$f" "$base/warped/$f"
            put "low_$f" "$base/lowres/$f"
          done

